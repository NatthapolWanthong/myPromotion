<!-- Customer_Add.html -->
<div id="customer-add-modal" aria-hidden="true">
  <div class="ca-backdrop" data-role="backdrop"></div>

  <div class="ca-dialog" role="dialog" aria-modal="true">
    <div class="ca-header">
      <div class="ca-title">จัดการลูกค้า</div>
      <button type="button" class="btn-close" aria-label="Close" data-role="close"></button>
    </div>

    <div class="ca-body">
      <input type="hidden" id="ca-promotion-id" />

      <!-- toolbar will be populated by JS -->
      <div id="ca-toolbar" class="mt-3 d-flex gap-2 align-items-center"></div>

      <div class="table-responsive mt-2">
        <table
          id="ca-table"
          class="table table-bordered table-sm customer-add-table promo-table"
          data-toolbar="#ca-toolbar"
          data-pagination="true"
          data-search="true"
          data-show-refresh="true"
          data-show-columns="true"
          data-side-pagination="server">
          <thead>
            <tr>
              <th data-field="state" data-checkbox="true"></th>
              <th data-field="id" data-visible="false" data-switchable="false">id</th>
              <th data-field="code" data-sortable="true">รหัสลูกค้า</th>
              <th data-field="name" data-sortable="true">ชื่อลูกค้า</th>
              <th data-field="type_area" data-sortable="true">กลุ่มเขต</th>
              <th data-field="area_name" data-sortable="true">เขต</th>
              <th data-field="segment" data-sortable="true">กลุ่มลูกค้า</th>
              <th data-field="grade" data-sortable="true">เกรด</th>
              <th data-field="size" data-sortable="true">ขนาด</th>
              <th data-field="province" data-sortable="true">จังหวัด</th>
              <th data-field="district" data-sortable="true">อำเภอ</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="11" class="small text-muted">ยังไม่มีข้อมูล</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="ca-footer">
      <button id="ca-save" class="btn btn-primary">ตกลง</button>
      <button id="ca-cancel" class="btn btn-secondary" data-role="cancel">ยกเลิก</button>
    </div>
  </div>
</div>
